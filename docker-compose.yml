services:
  db:
    image: mysql:8.4
    container_name: fastflow_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: fastflow_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-3306}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DEBUG: ${DEBUG:-True}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      echo 'Esperando MySQL...';
      while ! nc -z db 3306; do
        sleep 1;
      done;
      echo 'MySQL listo';
      python manage.py migrate;
      echo 'Ejecutando seed_fastflow...';
      python manage.py seed_fastflow;
      python manage.py runserver 0.0.0.0:8000
      "
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check --database default"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    image: node:20
    container_name: fastflow_frontend
    working_dir: /app
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
    environment:
      REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "
      npm install &&
      npm start
      "
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  mysql_data:
    name: fastflow_mysql_data

networks:
  default:
    name: fastflow_default
